[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lakeflow-community-connectors-informix"
version = "0.1.0"
description = "Informix connector for Lakeflow Community Connectors"
requires-python = ">=3.10"
dependencies = [
    "lakeflow-community-connectors>=0.1.0",
    # Postgres driver for Lakebase state. The binary wheel bundles libpq so it
    # installs without a compiler/pg_config (absent on serverless pipeline
    # compute); the connector prefers a preinstalled psycopg2 and only falls back
    # to this. Deployments that load the merged single-file source instead of this
    # wheel must add psycopg2-binary or psycopg[binary] to the pipeline environment.
    "psycopg[binary]>=3.1,<4.0",
]

[project.optional-dependencies]
dev = [
    "pyspark>=4.2.0.dev0",
    "pytest>=7.0.0,<9.0",
    "pytest-cov>=4.0.0,<7.0",
]

[tool.setuptools]
packages = ["databricks.labs.community_connector.sources.informix"]

[tool.setuptools.package-dir]
"databricks.labs.community_connector.sources.informix" = "."

[tool.setuptools.package-data]
"*" = ["*.json", "*.md", "*.yaml"]
